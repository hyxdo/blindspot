[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blindspot"
version = "0.2.0"
description = "Find, save, and fix the lighting, blur, and framing conditions that break image classifiers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blindspot = "blindspot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindspot = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
